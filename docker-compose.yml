version: '3.8'

services:
  cms-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: cmsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./cmsdb_init_script.sql:/docker-entrypoint-initdb.d/cmsdb_init_script.sql
    networks:
      - app-network
      
  cms-app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cms-db:5432/cmsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - cms-db
    ports:
      - "8088:8088"
    networks:
      - app-network
      
volumes:
  postgres-data:
  
networks:
  app-network:
