apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cms-api
  template:
    metadata:
      labels:
        app: cms-api
    spec:
      containers:
      - name: cms-api
        image: sowmyasantoshi4/cms-api:latest
        ports:
        - containerPort: 8088
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: cms-api-service
  labels: 
    app: cms-api
spec:
  selector:
    app: cms-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8088
  type: NodePort